<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="novyra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Geometric Hexagonal Emblem -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" stroke="url(#novyra-grad)" stroke-width="4" fill="#0b0f17" fill-opacity="0.8" />
  <!-- Stylized N & Play Arrow -->
  <path d="M30 70 L30 30 L46 54 L62 30 L62 70" stroke="url(#novyra-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="70" cy="50" r="4" fill="#10b981" filter="url(#glow)" />
</svg>
